<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>The Weeknd &middot; Lyric Rail</title>
  <meta name="theme-color" content="#160d15">
  <link rel="icon" type="image/png" href="xo-logo.png">
  <link rel="apple-touch-icon" href="xo-logo.png">
  <style>
    :root {
      --bg: #160d15;
      --bg2: #1e1220;
      --card: #241522;
      --red: #fa5172;
      --gold: #e9c87a;
      --paper: #fff6ed;
      --muted: #b3a5b0;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding-bottom: env(safe-area-inset-bottom, 24px);
      overflow-x: hidden;
    }

    /* Fixed, centered wallpaper matching the app's content column, dimmed so text stays legible */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      bottom: 0;
      left: 50%;
      width: min(640px, 100vw);
      transform: translateX(-50%);
      background-image: url("wallpaper.png");
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      opacity: .3;
      z-index: -1;
      pointer-events: none;
    }

    /* ---------- Header ---------- */
    header {
      padding: calc(env(safe-area-inset-top, 0px) + 28px) 20px 6px;
      text-align: center;
      max-width: 640px;
      margin: 0 auto;
    }

    header b {
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--gold);
      text-transform: uppercase;
    }

    header h1 {
      font-size: clamp(32px, 9vw, 46px);
      line-height: .9;
      margin: 14px 0 8px;
      letter-spacing: -1.5px;
      font-weight: 800;
    }

    header h1 i {
      font-family: "Helvetica", serif;
      color: var(--red);
      font-weight: 400;
      font-style: italic;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    header img {
      height: 48px;
      width: auto;
      filter: brightness(0) invert(1);
    }

    /* ---------- Horizontal song rail ---------- */
    .rail-wrap {
      position: sticky;
      top: 0;
      z-index: 20;
      max-width: 640px;
      margin: 18px auto 0;
      padding: 18px 0 14px;
      background: linear-gradient(180deg, var(--bg) 10%, transparent);
      backdrop-filter: blur(3px);
    }

    .rail {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-snap-type: x proximity;
      padding: 4px 16px 10px;
      scrollbar-width: thin;
      scrollbar-color: var(--red) transparent;
    }

    .rail::-webkit-scrollbar {
      height: 6px;
    }

    .rail::-webkit-scrollbar-thumb {
      background: #fa517266;
      border-radius: 99px;
    }

    .rail::-webkit-scrollbar-track {
      background: transparent;
    }

    .song-card {
      scroll-snap-align: start;
      flex: 0 0 auto;
      width: 132px;
      border-radius: 16px;
      border: 1px solid #ffffff22;
      background: rgba(36, 21, 34, .55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 12px;
      cursor: pointer;
      text-align: left;
      color: inherit;
      font: inherit;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
      -webkit-user-select: none;
      user-select: none;
    }

    .song-card:active {
      transform: scale(.96);
    }

    .song-card .num {
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--gold);
      font-weight: 700;
    }

    .song-card .name {
      font-size: 13.5px;
      font-weight: 700;
      margin-top: 3px;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .song-card.active {
      border-color: var(--red);
      background: linear-gradient(160deg, rgba(51, 32, 47, .7), rgba(36, 21, 34, .55));
      transform: translateY(-3px);
      box-shadow: 0 10px 24px -8px #fa517255;
    }

    .rail-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      padding-top: 2px;
    }

    .rail-dots span {
      width: 6px;
      height: 6px;
      border-radius: 99px;
      background: #ffffff30;
      transition: background .2s, width .2s;
    }

    .rail-dots span.on {
      background: var(--red);
      width: 16px;
    }

    /* ---------- Lyrics sections ---------- */
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 6px 16px 40px;
    }

    .song {
      background: rgba(36, 21, 34, .5);
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
      border: 1px solid #ffffff1c;
      border-radius: 22px;
      padding: 22px 18px;
      margin-top: 18px;
      scroll-margin-top: 120px;
    }

    .song .meta {
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .song h2 {
      font-size: clamp(26px, 7vw, 34px);
      margin: 8px 0 4px;
      line-height: 1.05;
    }

    .lyrics {
      padding: 16px 16px 4px;
      background: rgba(16, 10, 16, .45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 14px;
      line-height: 1.6;
      font-family: "Helvetica", "Times New Roman", serif;
      font-size: 19px;
      margin-top: 16px;
    }

    .lyrics h3 {
      font: 700 11px -apple-system, Arial;
      color: var(--gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 20px 0 8px;
    }

    .lyrics h3:first-child {
      margin-top: 0;
    }

    .lyrics p {
      margin: 0 0 8px;
    }

    .pager {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .pager button {
      flex: 1;
      padding: 13px;
      border: 1px solid #ffffff2a;
      background: #ffffff10;
      color: #fff;
      border-radius: 12px;
      font: 600 13px inherit;
      cursor: pointer;
    }

    .pager button:active {
      background: #ffffff22;
    }

    footer {
      text-align: center;
      color: #988995;
      font-size: 11px;
      padding: 24px 20px 10px;
    }

    @media (max-width:380px) {
      .song-card {
        width: 112px;
      }
    }
  </style>
</head>

<body>

  <header>
    <img src="xo-logo.png" alt="XO" />
    <h1>After Hours Til Dawn</h1>
    <p>The Final Leg Before Shutdown</p>
  </header>

  <div class="rail-wrap">
    <div class="rail" id="rail"></div>
    <div class="rail-dots" id="dots"></div>
  </div>

  <main id="main"></main>

  <footer>20261002 &middot; The Weeknd &middot; Singapore</footer>

  <script src="lyrics.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const rail = $("rail");
    const dots = $("dots");
    const main = $("main");

    rail.innerHTML = songs.map((s, i) => `
      <button class="song-card" data-i="${i}" aria-label="Jump to ${s.title}">
        <div class="num">TRACK ${String(s.number).padStart(2, "0")}</div>
        <div class="name">${s.title}</div>
      </button>
    `).join("");

    dots.innerHTML = songs.map(() => `<span></span>`).join("");

    main.innerHTML = songs.map((s, i) => `
      <section class="song" id="song-${i}">
        <div class="meta">Track ${String(s.number).padStart(2, "0")}</div>
        <h2>${s.title}</h2>
        <div class="lyrics">
          ${s.sections.map(sec => `
            <h3>${sec.label}</h3>
            ${sec.lines.map(l => `<p>${l}</p>`).join("")}
          `).join("")}
        </div>
        <div class="pager">
          <button data-prev="${i}" ${i === 0 ? "disabled" : ""}>&larr; Previous</button>
          <button data-next="${i}" ${i === songs.length - 1 ? "disabled" : ""}>Next &rarr;</button>
        </div>
      </section>
    `).join("");

    const cards = [...rail.querySelectorAll(".song-card")];
    const dotEls = [...dots.querySelectorAll("span")];
    const sectionEls = songs.map((_, i) => $("song-" + i));

    function setActive(i) {
      cards.forEach((c, ci) => c.classList.toggle("active", ci === i));
      dotEls.forEach((d, di) => d.classList.toggle("on", di === i));
    }

    function jumpTo(i, smooth = true) {
      sectionEls[i].scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
      cards[i].scrollIntoView({ behavior: smooth ? "smooth" : "auto", inline: "center", block: "nearest" });
      setActive(i);
    }

    rail.addEventListener("click", (e) => {
      const card = e.target.closest(".song-card");
      if (!card) return;
      jumpTo(Number(card.dataset.i));
    });

    main.addEventListener("click", (e) => {
      const prev = e.target.closest("[data-prev]");
      const next = e.target.closest("[data-next]");
      if (prev) jumpTo(Number(prev.dataset.prev) - 1);
      if (next) jumpTo(Number(next.dataset.next) + 1);
    });

    // Keep the rail in sync with whichever song is scrolled into view.
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          const i = sectionEls.indexOf(entry.target);
          if (i !== -1) setActive(i);
        }
      });
    }, { rootMargin: "-40% 0px -50% 0px", threshold: 0 });

    sectionEls.forEach(el => observer.observe(el));

    setActive(0);
  </script>
</body>

</html>
